[package]
name = "balance-atlas"
version = "0.10.38"
description = "Overwatch hero update history and professional esports schedule"
authors = ["OW Hero Update History"]
edition = "2021"

[lib]
name = "balance_atlas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
urlencoding = "2"
regex = "1"
scraper = "0.24"
futures = "0.3"
csv = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tauri-plugin-opener = "2"
